name: medikiosk
description: "MediKiosk — AI-Powered Patient Case-Taking Software"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3

  # Storage
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  open_file: ^3.5.4

  # Speech / Voice
  speech_to_text: ^7.0.1
  flutter_tts: ^4.2.2

  # Camera / Document scanning
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Permissions
  permission_handler: ^11.4.0
  local_auth: ^2.3.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  json_annotation: ^4.9.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.5
  record: ^6.2.1
  http: ^1.6.0
  webview_flutter: ^4.13.0
  sidebarx: ^0.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
